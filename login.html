<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión | JEMA Market S.A.S.</title>
  <link rel="stylesheet" href="estilos/colores.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .login-wrapper-min {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--fondo-suave);
      padding: 24px;
    }
    .caja-login-min {
      width: 100%;
      max-width: 380px;
      background: #FFFFFF;
      border: 1px solid var(--color-borde);
      border-radius: var(--radio-esquinas);
      padding: 36px 30px;
    }
  </style>
</head>
<body class="login-wrapper-min">

  <div class="caja-login-min">
    <div style="text-align: center; margin-bottom: 24px;">
      <a href="index.html">
        <img src="imagenes/logo.png" alt="Logo JEMA" style="height: 48px; margin: 0 auto 12px;">
      </a>
      <h1 style="font-size: 20px; font-weight: 800; color: var(--color-marino-oscuro);">Acceso a JEMA Market</h1>
      <p style="font-size: 13px; color: var(--color-texto-suave);">Ingresa con tu correo y contraseña</p>
    </div>

    <form action="index.html">
      <div class="formulario-grupo">
        <label class="formulario-etiqueta">Correo</label>
        <input type="email" class="formulario-control" value="admin@jemamarket.com" required>
      </div>

      <div class="formulario-grupo">
        <div style="display: flex; justify-content: space-between;">
          <label class="formulario-etiqueta">Contraseña</label>
          <a href="#" style="font-size: 11.5px; color: var(--color-azul-primario);">¿Olvidaste tu clave?</a>
        </div>
        <input type="password" class="formulario-control" value="••••••••" required>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 20px;">
        <a href="admin.html" class="btn btn-principal btn-bloque">Entrar como Administrador / Empleado</a>
        <a href="index.html" class="btn btn-borde btn-bloque">Entrar como Cliente</a>
      </div>
    </form>
  </div>

</body>
</html>
